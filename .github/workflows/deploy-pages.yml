name: Deploy Minimal Hyperbolic Micromagnetics

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "src/**"
      - "pyproject.toml"
      - "pixi.toml"
      - "pixi.lock"
  pull_request:
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "src/**"
      - "pyproject.toml"
      - "pixi.toml"
      - "pixi.lock"

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  shinylive:
    uses: posit-dev/py-shinylive/.github/workflows/deploy-app.yaml@actions/v1
    with:
      app-dir: src
      shinylive-version: "shinylive==0.8.12"
    permissions:
      contents: read
      pages: write
      id-token: write
