[workspace]
authors = ["Michael P. Adams"]
channels = ["conda-forge"]
name = "minimal-hyperbolic-micromagnetics"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
compute = "python examples/hysteresis_example.py"
nucleation-field = "python examples/nucleation_field_example.py"
sw-astroide-example = "python examples/sw_astroide_example.py"
coercive-field = "python examples/sw_coercive_field_example.py"
sw-ensemble = "python examples/sw_ensemble_hysteresis_example.py"
uniform-vortex-crossover = "python examples/uniform_vortex_crossover_example.py"
analytical-remanence = "python examples/analytical_remanence.py"
analytical-coercivity = "python examples/analytical_coercivity.py"
hprime-hysteresis = "python examples/hprime_hysteresis_example.py"
profile-functions = "python examples/profile_functions_example.py"
vortex-field-profile = "python examples/vortex_field_profile_example.py"
test = "pytest test"
sw-astroid = "python test/test_sw_astroid_minimal_model.py"

[dependencies]
hatchling = ">=1.27,<2"
matplotlib = ">=3.10,<4"
numpy = ">=2.3,<3"
pandas = ">=2.3,<3"
pillow = ">=11,<13"
python = ">=3.12,<3.13"
pytest = ">=8.4,<9"
pyvista = ">=0.46,<0.47"

[pypi-dependencies]
minimal-hyperbolic-micromagnetics = { path = ".", editable = true }
paperfig = { git = "https://github.com/AdamsMP92/paperfig.git" }
